<clipPath id="r"><rect width="1280" height="420" rx="16"/></clipPath></defs><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
