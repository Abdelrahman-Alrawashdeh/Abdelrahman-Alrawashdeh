<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Sufrti — Restaurant and café management platform: interactive QR menus, point of sale with receipt printing and bill splitting, a kitchen display, live order tracking, analytics and multi-branch control, in Arabic and English. Designed, built and operated solo." xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0"/><stop offset=".5" stop-color="#2563eb" stop-opacity=".9"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#000000" stroke-opacity=".045"/></pattern>
