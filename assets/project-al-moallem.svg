<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="Al-Moallem Driving Center: Arabic RTL website with a 458-question theory bank, a timed 60-minute exam room and a learning library. Static, accessible and deployed on Cloudflare Workers.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140d2a"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset=".5" stop-color="#f59e0b" stop-opacity=".2"/><stop offset="1" stop-color="#f59e0b"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="gl" cx=".85" cy=".25" r=".55"><stop offset="0" stop-color="#f59e0b" stop-opacity=".35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.f{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(-5px) rotate(-3deg)}50%{transform:translateY(5px) rotate(3deg)}}@media (prefers-reduced-motion:reduce){.f{animation:none}}</style>
<rect x="1.5" y="1.5" width="617" height="297" rx="20" fill="url(#bg)"/><rect x="1.5" y="1.5" width="617" height="297" rx="20" fill="url(#gl)"/>
<rect x="1.5" y="1.5" width="617" height="297" rx="20" fill="none" stroke="url(#bd)" stroke-width="2"/>
<g transform="translate(520 82)"><g class="f" style="transform-box:fill-box;transform-origin:center"><g filter="url(#g)"><circle r="44" fill="none" stroke="#fbbf24" stroke-width="9"/><circle r="10" fill="#fbbf24"/>
<path d="M-40,-6 Q0,-22 40,-6" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/><path d="M0,10 L0,42" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
<circle r="44" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="40 240"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/></circle></g></g></g>
<g font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
<text x="30" y="56" fill="#fbbf24" font-size="13" font-weight="600" letter-spacing="2.5">DRIVING SCHOOL · JORDAN</text>
<text x="30" y="98" fill="url(#tt)" font-size="30" font-weight="800">Al-Moallem Driving Center</text>
<text x="30" y="150" fill="#94a3b8" font-size="15.5">Arabic RTL website with a 458-question theory bank,</text><text x="30" y="174" fill="#94a3b8" font-size="15.5">a timed 60-minute exam room and a learning library.</text><text x="30" y="198" fill="#94a3b8" font-size="15.5">Static, accessible and deployed on Cloudflare Workers.</text><g transform="translate(30 238)"><rect width="54" height="28" rx="14" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="27" y="19" text-anchor="middle" fill="#e2e8f0" font-size="13">HTML</text></g><g transform="translate(92 238)"><rect width="47" height="28" rx="14" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="23" y="19" text-anchor="middle" fill="#e2e8f0" font-size="13">CSS</text></g><g transform="translate(147 238)"><rect width="100" height="28" rx="14" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="50" y="19" text-anchor="middle" fill="#e2e8f0" font-size="13">JavaScript</text></g><g transform="translate(255 238)"><rect width="100" height="28" rx="14" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="50" y="19" text-anchor="middle" fill="#e2e8f0" font-size="13">Playwright</text></g><g transform="translate(363 238)"><rect width="100" height="28" rx="14" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="50" y="19" text-anchor="middle" fill="#e2e8f0" font-size="13">Cloudflare</text></g>
</g></svg>