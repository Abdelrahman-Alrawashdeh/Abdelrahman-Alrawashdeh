<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="356" viewBox="0 0 1280 356" role="img" aria-label="Capabilities: Full-Stack Engineering, Security by Design, Operations." xmlns:c2pa="http://c2pa.org/manifest">
