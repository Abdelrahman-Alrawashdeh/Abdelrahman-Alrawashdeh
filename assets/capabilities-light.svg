<g clip-path="url(#r)"><rect width="1280" height="356" fill="#fafafa"/><g class="s in"><text x="48" y="66" font-size="15" font-weight="600" letter-spacing="2.2" fill="#2563eb">01</text><text x="86" y="66" font-size="15" font-weight="600" letter-spacing="2.2" fill="#71717a">CAPABILITIES</text></g><g class="s in a2"><rect x="48" y="96" width="379" height="222" rx="12" fill="#ffffff" stroke="#e4e4e7"/><g transform="translate(96 148)"><rect x="-26" y="-26" width="52" height="52" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><g stroke="#2563eb"><path d="M0,-17 L14,-11 V1 C14,10 7,16 0,19 C-7,16 -14,10 -14,1 V-11 Z" fill="none" stroke-width="2.2" stroke-linejoin="round"/><path d="M-5,1 L-1,5 L6,-3" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="140" y="156" font-size="22" font-weight="650" fill="#09090b">Security</text><text x="72" y="208" font-size="16.5" fill="#52525b">Secure-by-design web applications,</text><text x="72" y="234" font-size="16.5" fill="#52525b">hardened authentication flows, threat-</text><text x="72" y="260" font-size="16.5" fill="#52525b">aware architecture and careful handling of</text><text x="72" y="286" font-size="16.5" fill="#52525b">user data.</text></g><g class="s in a3"><rect x="451" y="96" width="379" height="222" rx="12" fill="#ffffff" stroke="#e4e4e7"/><g transform="translate(499 148)"><rect x="-26" y="-26" width="52" height="52" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><g stroke="#2563eb"><path d="M-6,-10 L-16,0 L-6,10 M6,-10 L16,0 L6,10" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="543" y="156" font-size="22" font-weight="650" fill="#09090b">Engineering</text><text x="475" y="208" font-size="16.5" fill="#52525b">Full-stack products with fast, accessible</text><text x="475" y="234" font-size="16.5" fill="#52525b">interfaces in HTML, CSS and JavaScript,</text><text x="475" y="260" font-size="16.5" fill="#52525b">Node.js services and Python tooling.</text></g><g class="s in a4"><rect x="853" y="96" width="379" height="222" rx="12" fill="#ffffff" stroke="#e4e4e7"/><g transform="translate(901 148)"><rect x="-26" y="-26" width="52" height="52" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><g stroke="#2563eb"><path d="M-12,9 H11 A8,8 0 0 0 10,-7 A11,11 0 0 0 -10,-4 A7,7 0 0 0 -12,9 Z" fill="none" stroke-width="2.2" stroke-linejoin="round"/></g></g><text x="945" y="156" font-size="22" font-weight="650" fill="#09090b">Operations</text><text x="877" y="208" font-size="16.5" fill="#52525b">Automated CI/CD on self-hosted runners,</text><text x="877" y="234" font-size="16.5" fill="#52525b">containerised builds with Docker, and edge</text><text x="877" y="260" font-size="16.5" fill="#52525b">deployment on Cloudflare.</text></g></g>
