name: Profile visuals

# Regenerates the 3D contribution calendar every day.
# Output is force-pushed to the separate `output` branch, so `main` keeps a clean history.
#
# Optional: add a repository secret named PROFILE_TOKEN (classic token with `repo` + `read:user`)
# so private contributions are included. Without it, only public activity is counted.
on:
  schedule:
    - cron: "17 21 * * *" # daily, 00:17 Amman time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-visuals.yml"]

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: profile-3d-contrib
          keep_history: false
          jekyll: false
          commit_message: "chore: update profile visuals"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
